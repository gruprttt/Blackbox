# Rate limits (per client IP). Sign-in/sign-up/reset endpoints get a tight budget; everything else a
# generous one. The API applies its own per-account limits on top of these.
limit_req_zone $binary_remote_addr zone=bb_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=bb_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Keep the CSP in step with SITE_HEADERS in server/server.py.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Serving over HTTPS? Uncomment to tell browsers to never use plain HTTP again:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Pages and assets revalidate via ETag, so a rebuild is picked up immediately.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Accounts: sign-in, sign-up, password reset, Google
    location /api/auth/ {
        limit_req zone=bb_auth burst=20 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Progress sync
    location /api/ {
        limit_req zone=bb_api burst=60 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
