# Study with one command:   docker compose up -d   →   http://localhost:8080
# Progress is stored in the "blackbox-data" volume and survives rebuilds and restarts.
name: blackbox

services:
  blackbox:
    build:
      context: ..
      dockerfile: learn-ui/Dockerfile
      target: web
    pull_policy: build          # rebuild the site on every `up` (cached layers make it fast)
    image: blackbox-web:latest
    container_name: blackbox
    ports:
      - "${BLACKBOX_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: learn-ui/Dockerfile
      target: api
    pull_policy: build
    image: blackbox-api:latest
    container_name: blackbox-api
    volumes:
      - blackbox-data:/data
    restart: unless-stopped

volumes:
  blackbox-data:
