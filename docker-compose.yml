# Study with one command:   docker compose up -d   →   http://localhost:8080
# Progress is stored in the "blackbox-data" volume and survives rebuilds and restarts.
name: blackbox

services:
  blackbox:
    build:
      context: ..
      dockerfile: learn-ui/Dockerfile
      target: web
    pull_policy: build          # rebuild the site on every `up` (cached layers make it fast)
    image: blackbox-web:latest
    container_name: blackbox
    ports:
      - "${BLACKBOX_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: learn-ui/Dockerfile
      target: api
    pull_policy: build
    image: blackbox-api:latest
    container_name: blackbox-api
    volumes:
      - blackbox-data:/data
    # Optional features — put the values in a .env file next to this one (see .env.example).
    environment:
      BLACKBOX_BASE_URL: ${BLACKBOX_BASE_URL:-http://localhost:8080}
      BLACKBOX_SIGNUP: ${BLACKBOX_SIGNUP:-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    restart: unless-stopped

volumes:
  blackbox-data:
